# SonarCloud 웹사이트에서 생성된 프로젝트 Key와 Organization 입력
sonar.projectKey=SA-ClipboardManager_clipboard-manager-electron
sonar.organization=sa-clipboardmanager
# 소스 코드 경로 (. 은 현재 폴더 전체)
sonar.sources=.

# 분석에서 제외할 경로 (Electron 빌드 결과물, 라이브러리 폴더 등)
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/*.spec.ts, **/*.test.tsx

# 테스트 코드 경로 (있다면 지정, 없다면 주석 처리)
# sonar.tests=tests
# sonar.test.inclusions=**/*.test.ts, **/*.spec.ts

# 언어 인코딩
sonar.sourceEncoding=UTF-8

# (선택) LCOV 커버리지 파일 경로 (테스트 코드를 돌려서 lcov.info가 나온다면 경로 지정)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
